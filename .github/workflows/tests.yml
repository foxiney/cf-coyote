name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check JavaScript syntax
        run: |
          for file in core.js background.js control.js connection.js features.js content.js appearance.js; do
            node --check "$file" || exit 1
          done
      - name: Run mock regression tests
        run: node --test tests/regression.cjs tests/connection.cjs
